<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Z A M A R</title>
    <link rel="stylesheet" href="css/Style.css?v=3">
</head>
<body>
<div class="auth-wrap">
    <!-- Visual Side -->
    <div class="auth-visual">
        <div class="auth-visual-content">
            <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-light);margin-bottom:24px;">Welcome Back</div>
            <h2>Style Meets<br><em>Elegance</em></h2>
            <p style="margin-top:20px;">Log in to access your orders,<br>exclusive deals, and more.</p>
            <div style="margin-top:40px;display:flex;gap:24px;justify-content:center;opacity:0.4;">
                <div style="text-align:center;">
                    <div style="font-family:'Playfair Display',serif;font-size:28px;color:white;">500+</div>
                    <div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;">Products</div>
                </div>
                <div style="width:1px;background:rgba(255,255,255,0.1);"></div>
                <div style="text-align:center;">
                    <div style="font-family:'Playfair Display',serif;font-size:28px;color:white;">10K+</div>
                    <div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;">Customers</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Side -->
    <div class="auth-form-wrap">
        <div class="auth-form">
            <div class="auth-logo">Z A M A R</div>
            <div class="auth-subtitle">Sign in to your account</div>

            <div class="alert" id="alertMsg"></div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••">
            </div>

            <button class="btn btn-dark btn-full" onclick="doLogin()" style="margin-top:8px;">Sign In</button>

            <div class="auth-link">
                Don't have an account? <a href="Register.html">Create one</a>
            </div>

            <!-- Test credentials hint -->
            <div style="margin-top:32px;padding:16px;background:var(--cream);border:1px solid var(--border);font-size:12px;color:var(--grey);">
                <div style="font-weight:600;margin-bottom:8px;color:var(--mid);">Test Accounts:</div>
                <div>👤 Admin: admin@shopeasy.com / admin123</div>
                <div style="margin-top:4px;">👤 Customer: Customer@shopeasy.com / Customer123</div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/Main.js?v=3"></script>
<script>
    function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!email || !password) { showAlert('alertMsg','Please fill all fields.','error'); return; }

    // Show loading state
    const btn = document.querySelector('button[onclick="doLogin()"]');
    if (btn) { btn.textContent = 'Signing in...'; btn.disabled = true; }

    fetch('/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    })
    .then(r => {
        if (!r.ok) throw new Error('Server error');
        return r.json();
    })
    .then(data => {
        // Reset button
        if (btn) { btn.textContent = 'Sign In'; btn.disabled = false; }

        if (data.success) {
            saveUser(data.user);
            showAlert('alertMsg','Login successful! Redirecting...','success');
            setTimeout(() => window.location.href = data.user.role === 'ADMIN' ? 'Admin.html' : 'index.html', 1000);
        } else {
            showAlert('alertMsg', data.message || 'Invalid email or password.','error');
        }
    })
    .catch(() => {
        // Reset button
        if (btn) { btn.textContent = 'Sign In'; btn.disabled = false; }
        // User friendly message — no technical details
        showAlert('alertMsg','Unable to connect. Please check your connection and try again.','error');
    });
}

document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
