<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Z A M A R</title>
    <link rel="stylesheet" href="css/Style.css?v=3">
</head>
<body>

<nav class="navbar">
    <div class="nav-left"></div>
    <a href="Index.html" class="logo">Z A M A R<span>Premium Menswear</span></a>
    <div class="nav-right">
        <a href="Products.html" class="nav-link">← Continue Shopping</a>
    </div>
</nav>

<div class="container" style="padding-top:48px;padding-bottom:80px;">

    <!-- Steps -->
    <div class="checkout-steps">
        <div class="step active" id="step1Indicator">
            <div class="step-num">1</div>
            <span>Shipping</span>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step2Indicator">
            <div class="step-num">2</div>
            <span>Payment</span>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step3Indicator">
            <div class="step-num">3</div>
            <span>Confirm</span>
        </div>
    </div>

    <div class="checkout-grid" style="display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start;">

        <!-- Left: Steps -->
        <div>

            <!-- Step 1: Shipping -->
            <div id="stepShipping">
                <div style="background:var(--white);border:1px solid var(--border);padding:32px;margin-bottom:24px;">
                    <h2 style="font-family:'Playfair Display',serif;font-size:22px;font-weight:500;margin-bottom:24px;">Shipping Information</h2>
                    <div class="alert" id="shippingAlert"></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Muhammad">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Umer">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" placeholder="+92 300 0000000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Address</label>
                        <input type="text" class="form-control" id="address" placeholder="House #, Street, Area">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <select class="form-control" id="city">
                                <option value="">Select City</option>
                                <option>Karachi</option>
                                <option>Lahore</option>
                                <option>Islamabad</option>
                                <option>Rawalpindi</option>
                                <option>Peshawar</option>
                                <option>Quetta</option>
                                <option>Multan</option>
                                <option>Faisalabad</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-control" id="postal" placeholder="75500">
                        </div>
                    </div>
                    <button class="btn btn-dark btn-full mt-8" onclick="goToPayment()">Continue to Payment →</button>
                </div>
            </div>

            <!-- Step 2: Payment -->
            <div id="stepPayment" style="display:none;">
                <div style="background:var(--white);border:1px solid var(--border);padding:32px;margin-bottom:24px;">
                    <h2 style="font-family:'Playfair Display',serif;font-size:22px;font-weight:500;margin-bottom:24px;">Payment Method</h2>
                    <div class="alert" id="paymentAlert"></div>

                    <!-- Payment Options -->
                    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:28px;">
                        <label style="display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);cursor:pointer;transition:border-color 0.2s;" id="codOption">
                            <input type="radio" name="payMethod" value="cod" checked onchange="togglePayment('cod')" style="width:18px;height:18px;">
                            <div>
                                <div style="font-weight:600;font-size:14px;margin-bottom:2px;">Cash on Delivery</div>
                                <div style="font-size:12px;color:var(--grey);">Pay when your order arrives</div>
                            </div>
                        </label>

                        <label style="display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);cursor:pointer;transition:border-color 0.2s;" id="cardOption">
                            <input type="radio" name="payMethod" value="card" onchange="togglePayment('card')" style="width:18px;height:18px;">
                            <div>
                                <div style="font-weight:600;font-size:14px;margin-bottom:2px;">Credit / Debit Card</div>
                                <div style="font-size:12px;color:var(--grey);">Visa, Mastercard, UnionPay</div>
                            </div>
                        </label>

                        <label style="display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);cursor:pointer;" id="easyOption">
                            <input type="radio" name="payMethod" value="easypaisa" onchange="togglePayment('easypaisa')" style="width:18px;height:18px;">
                            <div>
                                <div style="font-weight:600;font-size:14px;margin-bottom:2px;">📱 EasyPaisa / JazzCash</div>
                                <div style="font-size:12px;color:var(--grey);">Mobile wallet payment</div>
                            </div>
                        </label>
                    </div>

                    <!-- Card Details (shown when card selected) -->
                    <div id="cardDetails" style="display:none;padding:20px;background:var(--cream);border:1px solid var(--border);margin-bottom:20px;">
                        <div class="form-group">
                            <label class="form-label">Card Number</label>
                            <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" oninput="formatCard(this)">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Expiry Date</label>
                                <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                            </div>
                            <div class="form-group">
                                <label class="form-label">CVV</label>
                                <input type="text" class="form-control" id="cardCvv" placeholder="123" maxlength="3">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cardholder Name</label>
                            <input type="text" class="form-control" id="cardName" placeholder="Muhammad Umer">
                        </div>
                    </div>

                    <!-- Mobile Wallet -->
                    <div id="walletDetails" style="display:none;padding:20px;background:var(--cream);border:1px solid var(--border);margin-bottom:20px;">
                        <div class="form-group">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" class="form-control" id="walletNumber" placeholder="03XX-XXXXXXX">
                        </div>
                        <p style="font-size:12px;color:var(--grey);margin-top:8px;">You will receive a payment confirmation on this number.</p>
                    </div>

                    <div style="display:flex;gap:12px;">
                        <button class="btn btn-outline-dark" onclick="backToShipping()" style="flex:1;">← Back</button>
                        <button class="btn btn-dark" onclick="placeOrder()" style="flex:2;">Place Order →</button>
                    </div>
                </div>
            </div>

            <!-- Step 3: Confirmation -->
            <div id="stepConfirm" style="display:none;">
                <div class="order-confirm">
                    <div class="confirm-icon">✅</div>
                    <div class="confirm-order-id" id="confirmOrderId">ORDER #000</div>
                    <h2 style="font-family:'Playfair Display',serif;font-size:32px;font-weight:400;margin-bottom:12px;">Order Confirmed!</h2>
                    <p style="color:var(--grey);font-size:14px;margin-bottom:32px;line-height:1.8;" id="confirmMsg"></p>
                    <div id="confirmItems" style="text-align:left;border:1px solid var(--border);background:var(--cream);padding:20px;margin-bottom:32px;"></div>
                    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                        <a href="Orders.html" class="btn btn-dark">View My Orders</a>
                        <a href="Products.html" class="btn btn-outline-dark">Continue Shopping</a>
                    </div>
                </div>
            </div>

        </div>

        <!-- Right: Order Summary -->
        <div style="position:sticky;top:100px;">
            <div style="background:var(--white);border:1px solid var(--border);padding:28px;">
                <h3 style="font-family:'Playfair Display',serif;font-size:18px;font-weight:500;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);">Order Summary</h3>
                <div id="checkoutItems"></div>
                <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--grey);margin-bottom:8px;">
                        <span>Subtotal</span><span id="checkoutSubtotal">Rs. 0</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--grey);margin-bottom:16px;">
                        <span>Delivery</span><span id="deliveryFee">Rs. 250</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;font-family:'Playfair Display',serif;">
                        <span>Total</span><span id="checkoutTotal">Rs. 0</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="toast"></div>

<script src="js/Main.js?v=3"></script>
<script>
    updateNav();

    const DELIVERY_FEE = 250;
    let shippingData   = {};
    let selectedPayment = 'cod';

    // Pre-fill email if logged in
    const _u = getUser();
    if (_u && _u.email) document.getElementById('email').value = _u.email;
    if (_u && _u.name)  {
        const parts = _u.name.split(' ');
        document.getElementById('firstName').value = parts[0] || '';
        document.getElementById('lastName').value  = parts.slice(1).join(' ') || '';
    }
    if (_u && _u.phone) document.getElementById('phone').value = _u.phone;

    // Load cart summary
    function loadCartSummary() {
        const cart = getCart();
        const subtotal = cartTotal();
        const total = subtotal + (subtotal >= 5000 ? 0 : DELIVERY_FEE);

        document.getElementById('checkoutSubtotal').textContent = 'Rs. ' + subtotal.toLocaleString();
        document.getElementById('deliveryFee').textContent = subtotal >= 5000 ? 'FREE' : 'Rs. ' + DELIVERY_FEE;
        document.getElementById('checkoutTotal').textContent = 'Rs. ' + total.toLocaleString();

        document.getElementById('checkoutItems').innerHTML = cart.map(item => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;">
                <div>
                    <div style="font-weight:500;">${item.name}</div>
                    <div style="color:var(--grey);">Qty: ${item.qty}</div>
                </div>
                <div style="font-weight:600;">Rs. ${(item.price * item.qty).toLocaleString()}</div>
            </div>
        `).join('') || '<p style="color:var(--grey);text-align:center;padding:20px;">Cart is empty</p>';

        if (!cart.length) window.location.href = 'Products.html';
    }

    loadCartSummary();

    function togglePayment(method) {
        selectedPayment = method;
        document.getElementById('cardDetails').style.display   = method === 'card'      ? 'block' : 'none';
        document.getElementById('walletDetails').style.display = method === 'easypaisa' ? 'block' : 'none';
    }

    function formatCard(input) {
        let v = input.value.replace(/\D/g,'').substring(0,16);
        input.value = v.replace(/(.{4})/g,'$1 ').trim();
    }

    function goToPayment() {
        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const email     = document.getElementById('email').value.trim();
        const phone     = document.getElementById('phone').value.trim();
        const address   = document.getElementById('address').value.trim();
        const city      = document.getElementById('city').value;

        if (!firstName || !lastName || !email || !phone || !address || !city) {
            showAlert('shippingAlert','Please fill all shipping fields.','error');
            return;
        }

        shippingData = { firstName, lastName, email, phone, address, city,
            postal: document.getElementById('postal').value };

        document.getElementById('stepShipping').style.display = 'none';
        document.getElementById('stepPayment').style.display  = 'block';

        document.getElementById('step1Indicator').classList.remove('active');
        document.getElementById('step1Indicator').classList.add('done');
        document.getElementById('step2Indicator').classList.add('active');
    }

    function backToShipping() {
        document.getElementById('stepPayment').style.display  = 'none';
        document.getElementById('stepShipping').style.display = 'block';
        document.getElementById('step2Indicator').classList.remove('active');
        document.getElementById('step1Indicator').classList.remove('done');
        document.getElementById('step1Indicator').classList.add('active');
    }

    function placeOrder() {
        const user = getUser();
        const cart = getCart();

        if (!cart.length) { showAlert('paymentAlert','Your cart is empty.','error'); return; }

        const items = cart.map(i => ({
            productId: Number(i.id),
            quantity:  Number(i.qty),
            price:     Number(i.price)
        }));

        // Build payload — send userId for members, guest info for everyone else
        const payload = { items, shipping: shippingData, paymentMethod: selectedPayment };
        if (user) {
            payload.userId = Number(user.id);
        } else {
            payload.guestName  = (shippingData.firstName + ' ' + shippingData.lastName).trim();
            payload.guestEmail = shippingData.email;
            payload.guestPhone = shippingData.phone || '';
        }

        fetch('/api/orders/place', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const subtotal = cartTotal();
                const total    = subtotal + (subtotal >= 5000 ? 0 : DELIVERY_FEE);

                document.getElementById('confirmOrderId').textContent =
                    'ORDER #' + (data.orderIds ? data.orderIds[0] : '---');

                const memberNote = user
                    ? ' Login to track your order under My Orders.'
                    : ' We\'ll send updates to ' + shippingData.email + '.';
                document.getElementById('confirmMsg').textContent =
                    `Thank you, ${shippingData.firstName}! Your order has been placed successfully. ` +
                    `We will deliver to ${shippingData.address}, ${shippingData.city}. ` +
                    `Payment: ${selectedPayment === 'cod' ? 'Cash on Delivery' : selectedPayment}.` +
                    memberNote;

                document.getElementById('confirmItems').innerHTML = cart.map(item => `
                    <div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border);">
                        <span>${item.name} × ${item.qty}</span>
                        <strong>Rs. ${(item.price * item.qty).toLocaleString()}</strong>
                    </div>
                `).join('') + `
                    <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:12px;margin-top:4px;">
                        <span>Total Paid</span>
                        <span>Rs. ${total.toLocaleString()}</span>
                    </div>`;

                document.getElementById('stepPayment').style.display = 'none';
                document.getElementById('stepConfirm').style.display = 'block';
                document.getElementById('step2Indicator').classList.remove('active');
                document.getElementById('step2Indicator').classList.add('done');
                document.getElementById('step3Indicator').classList.add('active','done');

                clearCart();
            } else {
                showAlert('paymentAlert', data.message || 'Order failed. Please try again.', 'error');
            }
        })
        .catch(() => showAlert('paymentAlert','Server error. Please try again.','error'));
    }
</script>
</body>
</html>
