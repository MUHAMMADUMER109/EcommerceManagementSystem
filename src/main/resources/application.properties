spring.application.name=management

# ===== SUPABASE DATABASE =====
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USERNAME}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HIKARI POOL =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=ZAMARPool

# ===== DISABLE AUTO CONFIG =====
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

# ===== SERVER =====
server.port=${PORT:8081}

# ===== SUPABASE STORAGE =====
supabase.url=${SUPABASE_STORAGE_URL}
supabase.key=${SUPABASE_STORAGE_KEY}
supabase.bucket=products

# ===== FILE UPLOAD =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true